app: online-boutique
version: 1
description: Google Online Boutique v0.10.4 running in Docker Compose
compose_project: online-boutique
services:
  - name: frontend
    container: frontend
    type: stateless
    critical: false
    health: http://localhost:22000/_healthz
    faults: [crash, latency]
  - name: cartservice
    container: cartservice
    type: stateless
    critical: false
    health: tcp://localhost:22001
    faults: [crash, latency, timeout]
  - name: productcatalogservice
    container: productcatalogservice
    type: stateless
    critical: false
    health: tcp://localhost:22002
    faults: [crash, latency, timeout]
  - name: currencyservice
    container: currencyservice
    type: stateless
    critical: false
    health: tcp://localhost:22003
    faults: [crash, latency]
  - name: paymentservice
    container: paymentservice
    type: stateless
    critical: true
    health: tcp://localhost:22004
    faults: [crash, latency]
  - name: shippingservice
    container: shippingservice
    type: stateless
    critical: false
    health: tcp://localhost:22005
    faults: [crash, latency]
  - name: emailservice
    container: emailservice
    type: stateless
    critical: false
    health: tcp://localhost:22006
    faults: [crash, latency]
  - name: checkoutservice
    container: checkoutservice
    type: stateless
    critical: true
    health: tcp://localhost:22007
    faults: [crash, latency, timeout]
  - name: recommendationservice
    container: recommendationservice
    type: stateless
    critical: false
    health: tcp://localhost:22008
    faults: [crash, latency]
  - name: adservice
    container: adservice
    type: stateless
    critical: false
    health: tcp://localhost:22009
    faults: [crash, latency]
  - name: redis-cart
    container: redis-cart
    type: stateful
    critical: true
    health: tcp://localhost:22010
    faults: [connection_failure]
declared_dependencies:
  - from: frontend
    to: productcatalogservice
  - from: frontend
    to: currencyservice
  - from: frontend
    to: cartservice
  - from: frontend
    to: recommendationservice
  - from: frontend
    to: shippingservice
  - from: frontend
    to: checkoutservice
  - from: frontend
    to: adservice
  - from: checkoutservice
    to: productcatalogservice
  - from: checkoutservice
    to: shippingservice
  - from: checkoutservice
    to: paymentservice
  - from: checkoutservice
    to: emailservice
  - from: checkoutservice
    to: currencyservice
  - from: checkoutservice
    to: cartservice
  - from: cartservice
    to: redis-cart
  - from: recommendationservice
    to: productcatalogservice